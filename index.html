
<style>
*{box-sizing:border-box;margin:0;padding:0}
body,html{background:#0d0d0d}
.wrap{background:#0d0d0d;padding:40px 20px;min-height:100vh}
.grid{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid #2a2a2a;border-radius:6px;overflow:hidden;max-width:1100px;margin:0 auto}
.col{border-right:1px solid #2a2a2a}
.col:last-child{border-right:none}
.hdr{padding:10px 12px;font-size:12px;color:#666;background:#1a1a1a;border-bottom:1px solid #2a2a2a;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}
.body{padding:16px 12px;font-size:15px;font-weight:500;color:#e0e0d6;min-height:100px;outline:none;cursor:text;white-space:pre-wrap;word-break:break-word;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}
.body:hover{background:#161616}
.body:focus{background:#161616;box-shadow:inset 0 0 0 1px #3a3a3a}
.tip{font-size:11px;color:#444;text-align:center;margin-top:10px;opacity:0;transition:opacity 0.4s;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}
.tip.show{opacity:1}
@media(max-width:600px){
  .grid{grid-template-columns:1fr}
  .col{border-right:none;border-bottom:1px solid #2a2a2a}
  .col:last-child{border-bottom:none}
  .body{min-height:unset}
}
</style>

<div class="wrap">
  <div class="grid">
    <div class="col"><div class="hdr">周一</div><div class="body" contenteditable="true" data-day="mon"></div></div>
    <div class="col"><div class="hdr">周二</div><div class="body" contenteditable="true" data-day="tue"></div></div>
    <div class="col"><div class="hdr">周三</div><div class="body" contenteditable="true" data-day="wed"></div></div>
    <div class="col"><div class="hdr">周四</div><div class="body" contenteditable="true" data-day="thu"></div></div>
    <div class="col"><div class="hdr">周五</div><div class="body" contenteditable="true" data-day="fri"></div></div>
    <div class="col"><div class="hdr">周六</div><div class="body" contenteditable="true" data-day="sat"></div></div>
    <div class="col"><div class="hdr">周日</div><div class="body" contenteditable="true" data-day="sun"></div></div>
  </div>
  <p class="tip" id="tip">已保存</p>
</div>

<script>
const defaults={mon:'长距离 比目标配速慢40-60秒 16-18公里',tue:'下身训练',wed:'有氧跑或骑车 156-169bpm 30-40分钟',thu:'间歇跑或跑山 快于目标配速 400米快 100米慢 12组',fri:'乳酸阈值跑或跑山 热身2公里 169-174bpm 20-30分钟',sat:'下身训练',sun:'上身训练'};
const KEY='weekly_training_v1';
let t;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{};}catch{return {};}}
function save(){
  const d={};
  document.querySelectorAll('[data-day]').forEach(el=>{d[el.dataset.day]=el.innerText.trim();});
  localStorage.setItem(KEY,JSON.stringify(d));
  const tip=document.getElementById('tip');
  tip.classList.add('show');
  clearTimeout(tip._t);
  tip._t=setTimeout(()=>tip.classList.remove('show'),1800);
}
const saved=load();
document.querySelectorAll('[data-day]').forEach(el=>{
  el.innerText=saved[el.dataset.day]!==undefined?saved[el.dataset.day]:defaults[el.dataset.day];
  el.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(save,600);});
  el.addEventListener('blur',save);
});

document.documentElement.style.background='#0d0d0d';
document.body.style.background='#0d0d0d';
</script>
