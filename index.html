
<style>
h2.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.grid{display:grid;grid-template-columns:repeat(7,1fr);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden}
.col{border-right:0.5px solid var(--color-border-tertiary)}
.col:last-child{border-right:none}
.hdr{padding:8px 12px;font-size:12px;color:var(--color-text-secondary);background:var(--color-background-secondary);border-bottom:0.5px solid var(--color-border-tertiary)}
.body{padding:0;min-height:90px}
.body[contenteditable]{padding:12px;font-size:14px;font-weight:500;color:var(--color-text-primary);min-height:90px;outline:none;cursor:text;transition:background 0.15s}
.body[contenteditable]:hover{background:var(--color-background-secondary)}
.body[contenteditable]:focus{background:var(--color-background-secondary);box-shadow:inset 0 0 0 2px var(--color-border-primary)}
.saved-tip{font-size:12px;color:var(--color-text-tertiary);text-align:center;margin-top:10px;opacity:0;transition:opacity 0.4s}
.saved-tip.show{opacity:1}
@media(max-width:600px){
  .grid{grid-template-columns:1fr}
  .col{border-right:none;border-bottom:0.5px solid var(--color-border-tertiary)}
  .col:last-child{border-bottom:none}
  .body[contenteditable]{min-height:unset}
}
</style>

<h2 class="sr-only">每周训练计划，点击任意格可编辑内容，自动保存到本地</h2>

<div class="grid" id="grid">
  <div class="col"><div class="hdr">周一</div><div class="body" contenteditable="true" data-day="mon"></div></div>
  <div class="col"><div class="hdr">周二</div><div class="body" contenteditable="true" data-day="tue"></div></div>
  <div class="col"><div class="hdr">周三</div><div class="body" contenteditable="true" data-day="wed"></div></div>
  <div class="col"><div class="hdr">周四</div><div class="body" contenteditable="true" data-day="thu"></div></div>
  <div class="col"><div class="hdr">周五</div><div class="body" contenteditable="true" data-day="fri"></div></div>
  <div class="col"><div class="hdr">周六</div><div class="body" contenteditable="true" data-day="sat"></div></div>
  <div class="col"><div class="hdr">周日</div><div class="body" contenteditable="true" data-day="sun"></div></div>
</div>
<p class="saved-tip" id="tip">已保存</p>

<script>
const defaults={mon:'跑步',tue:'下身训练',wed:'骑车',thu:'跑步',fri:'下身训练',sat:'跑步',sun:'上身训练'};
const KEY='weekly_training_v1';
let saveTimer;

function load(){
  try{return JSON.parse(localStorage.getItem(KEY))||{};}catch{return {};}
}
function save(){
  const data={};
  document.querySelectorAll('[data-day]').forEach(el=>{data[el.dataset.day]=el.innerText.trim();});
  localStorage.setItem(KEY,JSON.stringify(data));
  const tip=document.getElementById('tip');
  tip.classList.add('show');
  clearTimeout(tip._t);
  tip._t=setTimeout(()=>tip.classList.remove('show'),1800);
}

const saved=load();
document.querySelectorAll('[data-day]').forEach(el=>{
  const day=el.dataset.day;
  el.innerText=saved[day]!==undefined?saved[day]:defaults[day];
  el.addEventListener('input',()=>{clearTimeout(saveTimer);saveTimer=setTimeout(save,600);});
  el.addEventListener('blur',save);
});
</script>
