<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每周训练计划</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0d0d0d; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; padding: 40px 20px; }
.grid { display: grid; grid-template-columns: repeat(7, 1fr); border: 1px solid #2a2a2a; border-radius: 6px; overflow: hidden; max-width: 1100px; margin: 0 auto; }
.col { border-right: 1px solid #2a2a2a; }
.col:last-child { border-right: none; }
.hdr { padding: 10px 12px; font-size: 12px; color: #666; background: #1a1a1a; border-bottom: 1px solid #2a2a2a; }
.body { padding: 16px 12px; font-size: 15px; font-weight: 500; color: #e0e0d6; min-height: 100px; }
@media (max-width: 600px) {
  .grid { grid-template-columns: 1fr; }
  .col { border-right: none; border-bottom: 1px solid #2a2a2a; }
  .col:last-child { border-bottom: none; }
  .body { min-height: unset; }
}
</style>
</head>
<body>
<div class="grid">
  <div class="col"><div class="hdr">周一</div><div class="body">跑步</div></div>
  <div class="col"><div class="hdr">周二</div><div class="body">下身训练</div></div>
  <div class="col"><div class="hdr">周三</div><div class="body">骑车</div></div>
  <div class="col"><div class="hdr">周四</div><div class="body">跑步</div></div>
  <div class="col"><div class="hdr">周五</div><div class="body">下身训练</div></div>
  <div class="col"><div class="hdr">周六</div><div class="body">跑步</div></div>
  <div class="col"><div class="hdr">周日</div><div class="body">上身训练</div></div>
</div>
</body>
</html>
